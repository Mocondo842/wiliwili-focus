name: Linux deb

# 同时产出 amd64 与 arm64 的桌面版 .deb，并在 CI 里真装一次、跑一次。
# arm64 走 GitHub 原生的 ubuntu-24.04-arm runner（公开仓库免费），不做交叉编译也不用 QEMU。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Debian 包版本号；留空则自动生成 <CMakeLists 版本>+focus.<短 SHA>'
        required: false
        default: ''
  push:
    branches: [ focus ]
    paths:
      - '.github/workflows/linux-deb.yaml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'wiliwili/**'
      - 'resources/**'
      - 'scripts/deb/desktop/**'

permissions:
  contents: read

# 同一分支只保留最新一次构建，避免连续 push 叠一堆跑不完的任务
concurrency:
  group: linux-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: 版本号
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          set -euo pipefail
          INPUT='${{ github.event.inputs.version }}'
          if [ -n "$INPUT" ]; then
            V="$INPUT"
          else
            APP="$(sed -n 's/^set(VERSION_MAJOR "\(.*\)")/\1/p' CMakeLists.txt).$(sed -n 's/^set(VERSION_MINOR "\(.*\)")/\1/p' CMakeLists.txt).$(sed -n 's/^set(VERSION_REVISION "\(.*\)")/\1/p' CMakeLists.txt)"
            V="${APP}+focus.$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号：$V"

  deb:
    name: deb-${{ matrix.arch }}
    needs: [ version ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 环境信息
        run: |
          echo "机器架构: $(uname -m)"
          echo "CPU 核数: $(nproc)"
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            zlib1g-dev libssl-dev libmpv-dev libwebp-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libpulse-dev libudev-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: 配置
        run: |
          cmake -B build -DPLATFORM_DESKTOP=ON -DCMAKE_BUILD_TYPE=Release \
                -DINSTALL=ON -DCMAKE_INSTALL_PREFIX=/usr

      - name: 编译
        run: cmake --build build -j"$(nproc)"

      - name: 暂存安装
        run: DESTDIR="$PWD/stage" cmake --install build

      - name: 打 deb
        run: |
          bash scripts/deb/desktop/build.sh stage \
            '${{ matrix.arch }}' '${{ needs.version.outputs.version }}' dist

      - name: 冒烟测试（装上去跑 20 秒）
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11
          bash scripts/deb/desktop/smoke.sh dist/*.deb 20

      - name: 上传 deb
        uses: actions/upload-artifact@v6
        with:
          name: wiliwili_${{ needs.version.outputs.version }}_${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发到 Release
    needs: [ version, deb ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # gh release 需要
      actions: read            # 下载 artifact 需要
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 取回两个架构的 deb
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          sha256sum ./*.deb | tee SHA256SUMS

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V='${{ needs.version.outputs.version }}'
          # tag 里不放 "+"：URL 里虽然合法，但容易在别处被当成空格
          TAG="deb-v$(printf '%s' "$V" | tr '+' '-')"
          echo "tag=$TAG"

          cat > notes.md <<EOF
          wiliwili「去推荐化」分支的 Linux 桌面版构建，由 GitHub Actions 从 focus 分支产出。

          - 版本：$V
          - 提交：${{ github.sha }}
          - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          安装：

              sudo apt install ./wiliwili_${V}_amd64.deb     # 或 _arm64.deb

          两个架构都已在 CI 里实装并冒烟运行过；本页附件同时提供 SHA256SUMS。
          EOF

          # 自检结果通过 warning annotation 带出来：CI 日志要登录才读得到，
          # 而 checks API 的 annotation 是匿名可读的。注意每条都要 || true ——
          # Actions 默认用 bash -e 跑 run:，未兜底的失败会直接把这一步打断。
          gh_path=$(command -v gh || echo none)
          gh_ver=$(gh --version 2>&1 | head -1 || true)
          gh_auth=$(gh auth status 2>&1 | tr '\n' '|' | head -c 300 || true)
          gh_perm=$(gh api "repos/$REPO" --jq '.permissions' 2>&1 | tr '\n' '|' | head -c 200 || true)
          echo "::warning title=diag::gh=$gh_path $gh_ver auth=$gh_auth perms=$gh_perm"

          fail() { echo "::error title=Release 失败::$1"; exit 1; }

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release 已存在，覆盖附件"
            if ! OUT=$(gh release upload "$TAG" dist/*.deb dist/SHA256SUMS \
                         --repo "$REPO" --clobber 2>&1); then
              fail "upload: $(printf '%s' "$OUT" | tr '\n' ' ' | head -c 800)"
            fi
          else
            echo "release 不存在，创建"
            if ! OUT=$(gh release create "$TAG" dist/*.deb dist/SHA256SUMS \
                         --repo "$REPO" \
                         --target '${{ github.sha }}' \
                         --title "Linux deb $V" \
                         --notes-file notes.md \
                         --prerelease 2>&1); then
              fail "create: $(printf '%s' "$OUT" | tr '\n' ' ' | head -c 800)"
            fi
          fi

          echo "下载页：${{ github.server_url }}/$REPO/releases/tag/$TAG"

